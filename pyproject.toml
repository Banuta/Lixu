[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lixu"
version = "0.2.0"
description = "Lumini CS2 (Game State Integration) pentru tastatură, placă de bază, Logitech, WLED și Govee"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lixu = "lixu.__main__:main"

[tool.setuptools]
packages = ["lixu", "lixu.devices", "lixu.discovery"]
