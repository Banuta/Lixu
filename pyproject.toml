[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aicolors"
version = "0.6.0"
description = "Lumini CS2 (Game State Integration) pentru tastatură, placă de bază, Logitech, WLED, Govee și Tuya; DPI, polling rate și baterie pentru mouse/căști Logitech"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tinytuya>=1.13"]

[project.optional-dependencies]
exe = ["pyinstaller>=6"]

[project.scripts]
aicolors = "aicolors.__main__:main"

[project.gui-scripts]
aicolors-app = "aicolors.__main__:main"

[tool.setuptools]
packages = ["aicolors", "aicolors.devices", "aicolors.discovery", "aicolors.peripherals"]

[tool.setuptools.package-data]
aicolors = ["ui/*.html", "ui/*.ico", "signalrgb/*.html"]
