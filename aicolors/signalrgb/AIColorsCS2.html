<head>
  <title>AI Colors CS2</title>
  <meta description="Culorile din AI Colors (CS2: echipă, viață, bombă, flash) pe toate dispozitivele SignalRGB."/>
  <meta publisher="AI Colors"/>
  <meta property="vertical" label="Pe verticală" type="boolean" default="0"/>
</head>
<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
<script>
  // Efect SignalRGB: citește culorile calculate de AI Colors și le întinde pe canvas,
  // de la stânga la dreapta (sau de sus în jos). Dispozitivele primesc culoarea locului
  // în care sunt așezate în Layout-ul SignalRGB.
  // Culorile vin de la AI Colors prin evenimentele SignalRGB:
  //   POST http://localhost:16034/canvas/event?sender=AIColors&event=c|rrggbb|rrggbb|...
  // (SignalRGB le dă efectului prin onCanvasApiEvent). Efectul nu poate citi singur de la
  // AI Colors: SignalRGB îl rulează pe o pagină https, iar http către 127.0.0.1 e blocat.
  // Fără legătură cu AI Colors: pulsează slab alb, ca să se vadă că efectul rulează.
  var c = document.getElementById("exCanvas");
  var ctx = c.getContext("2d");
  var colors = [];
  var zones = null;        // [{x, y, w, h, v, colors}] în procente; null = o singură bandă
  var showZones = false;
  var lastOk = 0;

  // apelată de SignalRGB pentru fiecare POST la /canvas/event
  var seen = 0;
  function onCanvasApiEvent(apiEvent) {
    if (seen < 3) { seen++; console.log("AI Colors CS2: eveniment primit, sender=" + (apiEvent && apiEvent["sender"])); }
    if (!apiEvent || apiEvent["sender"] !== "AIColors") return;
    var ev = apiEvent["event"];
    if (typeof ev === "string" && ev.indexOf("z|") === 0) { readZones(ev); return; }
    if (typeof ev !== "string" || ev.indexOf("c|") !== 0) return;
    var parts = ev.split("|"), out = [];
    for (var i = 1; i < parts.length; i++) {
      if (/^[0-9a-fA-F]{6}$/.test(parts[i])) out.push("#" + parts[i]);
    }
    if (out.length) { colors = out; zones = null; lastOk = Date.now(); }
  }

  // z|<arată 0/1>|x,y,w,h,v:rrggbb,rrggbb|...
  function readZones(ev) {
    var parts = ev.split("|"), out = [];
    for (var i = 2; i < parts.length; i++) {
      var half = parts[i].split(":");
      if (half.length !== 2) continue;
      var g = half[0].split(",").map(parseFloat);
      if (g.length < 5 || g.some(isNaN)) continue;
      var cols = half[1].split(",").filter(function (h) { return /^[0-9a-fA-F]{6}$/.test(h); })
                                    .map(function (h) { return "#" + h; });
      if (cols.length) out.push({x: g[0], y: g[1], w: g[2], h: g[3], v: g[4] === 1, colors: cols});
    }
    if (!out.length) return;
    zones = out; showZones = parts[1] === "1";
    lastOk = Date.now();
  }

  // o zonă: culorile ei ca benzi (orizontal de la stânga, vertical de jos în sus)
  function drawZone(z, W, H) {
    var x = z.x * W / 100, y = z.y * H / 100, w = z.w * W / 100, h = z.h * H / 100;
    var n = z.colors.length;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = z.colors[i];
      if (z.v) { var y1 = y + h - (i + 1) * h / n; ctx.fillRect(x, Math.floor(y1), w, Math.ceil(h / n) + 1); }
      else ctx.fillRect(Math.floor(x + i * w / n), y, Math.ceil(w / n) + 1, h);
    }
  }

  var MARK = ["#ffffff", "#00ff66", "#ff00ff", "#00e5ff", "#ffee00", "#ff3300", "#8866ff"];
  function drawMarks(W, H) {
    ctx.globalAlpha = 1;
    ctx.lineWidth = 2;
    ctx.font = "bold 12px sans-serif";
    for (var i = 0; i < zones.length; i++) {
      var z = zones[i], col = MARK[i % MARK.length];
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.strokeRect(z.x * W / 100 + 1, z.y * H / 100 + 1, z.w * W / 100 - 2, z.h * H / 100 - 2);
      ctx.fillText(String(i + 1), z.x * W / 100 + 4, z.y * H / 100 + 14);
    }
  }
  window.onCanvasApiEvent = onCanvasApiEvent;

  function update() {
    var w = c.width, h = c.height;
    var vert = (typeof vertical !== "undefined") && (vertical === true || vertical === 1 || vertical === "1" || vertical === "true");
    var now = Date.now();
    var stale = now - lastOk > 3000;
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    if (zones && !stale) {
      for (var k = 0; k < zones.length; k++) drawZone(zones[k], w, h);
      if (showZones) drawMarks(w, h);
    } else if (colors.length && !stale) {
      var n = colors.length;
      for (var i = 0; i < n; i++) {
        ctx.fillStyle = colors[i];
        if (vert) ctx.fillRect(0, Math.floor(i * h / n), w, Math.ceil(h / n) + 1);
        else ctx.fillRect(Math.floor(i * w / n), 0, Math.ceil(w / n) + 1, h);
      }
    } else if (stale) {
      // AI Colors nu răspunde (sau dispozitivul SignalRGB e oprit în AI Colors): puls alb slab
      ctx.globalAlpha = 0.04 + 0.08 * (0.5 + 0.5 * Math.sin(now / 600));
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
    }
    window.requestAnimationFrame(update);
  }

  window.requestAnimationFrame(update);
  console.log("AI Colors CS2: pornit, aștept culorile de la AI Colors (evenimente pe portul 16034)");
  setInterval(function () {
    if (!seen) console.log("AI Colors CS2: încă niciun eveniment de la AI Colors (rulează AI Colors? scrie la Dispozitive „trimite culorile la SignalRGB”?)");
  }, 10000);
</script>
