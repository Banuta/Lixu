<head>
  <title>AI Colors CS2</title>
  <meta description="Culorile din AI Colors (CS2: echipă, viață, bombă, flash) pe toate dispozitivele SignalRGB."/>
  <meta publisher="AI Colors"/>
  <meta property="vertical" label="Pe verticală" type="boolean" default="0"/>
</head>
<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
<script>
  // Efect SignalRGB: citește culorile calculate de AI Colors și le întinde pe canvas,
  // de la stânga la dreapta (sau de sus în jos). Dispozitivele primesc culoarea locului
  // în care sunt așezate în Layout-ul SignalRGB.
  // Portul e fix (3001, ca în AI Colors): controlul numeric din SignalRGB strica valoarea.
  // Fără legătură cu AI Colors: pulsează slab alb, ca să se vadă că efectul rulează.
  var c = document.getElementById("exCanvas");
  var ctx = c.getContext("2d");
  var URLS = ["http://127.0.0.1:3001/api/signalrgb", "http://localhost:3001/api/signalrgb"];
  var urlIndex = 0;
  var colors = [];
  var lastOk = 0;
  var busy = false;

  function failed() {
    busy = false;
    urlIndex = (urlIndex + 1) % URLS.length;   // încercăm și cealaltă adresă
  }

  function poll() {
    if (busy) return;
    busy = true;
    var xhr;
    try {
      xhr = new XMLHttpRequest();
      xhr.open("GET", URLS[urlIndex] + "?t=" + Date.now(), true);
      xhr.timeout = 500;
    } catch (e) { failed(); return; }
    xhr.onload = function () {
      try {
        var d = JSON.parse(xhr.responseText);
        if (d.colors) { colors = d.colors; lastOk = Date.now(); }
        busy = false;
      } catch (e) { failed(); }
    };
    xhr.onerror = xhr.ontimeout = xhr.onabort = failed;
    try { xhr.send(); } catch (e) { failed(); }
  }

  function update() {
    var w = c.width, h = c.height;
    var vert = (typeof vertical !== "undefined") && (vertical === true || vertical === 1 || vertical === "1" || vertical === "true");
    var now = Date.now();
    var stale = now - lastOk > 3000;
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    if (colors.length && !stale) {
      var n = colors.length;
      for (var i = 0; i < n; i++) {
        ctx.fillStyle = colors[i];
        if (vert) ctx.fillRect(0, Math.floor(i * h / n), w, Math.ceil(h / n) + 1);
        else ctx.fillRect(Math.floor(i * w / n), 0, Math.ceil(w / n) + 1, h);
      }
    } else if (stale) {
      // AI Colors nu răspunde (sau dispozitivul SignalRGB e oprit în AI Colors): puls alb slab
      ctx.globalAlpha = 0.04 + 0.08 * (0.5 + 0.5 * Math.sin(now / 600));
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
    }
    window.requestAnimationFrame(update);
  }

  setInterval(poll, 33);   // ~30 citiri pe secundă
  window.requestAnimationFrame(update);
</script>
