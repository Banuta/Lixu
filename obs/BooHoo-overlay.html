<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920,initial-scale=1">
<title>BooHoo · AI Colors · TikTok Camera 4:3</title>
<style>
/* Culorile din interfața AI Colors: fundal închis, portocaliu T, albastru CT.
   --a = accentul 1 (portocaliu), --b = accentul 2 (albastru), ca „r,g,b” ca să meargă în rgba().
   Cu AI Colors pornit și CS2 în joc, scriptul de jos le schimbă live în culoarea luminilor. */
:root{
  --a:255,138,31;          /* #ff8a1f  T  */
  --b:61,139,255;          /* #3d8bff  CT */
  --bg:15,17,21;           /* #0f1115 */
  --panel:23,26,33;        /* #171a21 */
  --line:42,47,58;         /* #2a2f3a */
  --text:#e6e8ee;
  --muted:#8b93a3;
  --green:#53fc18;
  --yt:#ff0033;
  --tt1:#25f4ee;
  --tt2:#fe2c55;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:1080px;
  height:1920px;
  overflow:hidden;
  background:transparent !important;
  font-family:"Segoe UI",Arial,sans-serif;
}

body{position:relative}

.overlay{
  position:relative;
  width:1080px;
  height:1920px;
  overflow:hidden;
  background:transparent;
}

/* =========================================================
   AMBIENT GLOW
========================================================= */

.hot-glow{
  position:absolute;
  z-index:0;
  border-radius:50%;
  filter:blur(48px);
  pointer-events:none;
  opacity:.5;
}

.g1{
  left:80px;top:10px;width:420px;height:120px;
  background:rgba(var(--a),.30);
  animation:glowHard 2.8s ease-in-out infinite;
}

.g2{
  right:80px;top:500px;width:360px;height:120px;
  background:rgba(var(--b),.28);
  animation:glowCenter 2.5s ease-in-out infinite reverse;
}

.g3{
  left:90px;bottom:15px;width:500px;height:120px;
  background:linear-gradient(90deg,rgba(var(--a),.26),rgba(var(--b),.26));
  animation:glowHard 3.1s ease-in-out infinite reverse;
}

/* =========================================================
   FRAME
========================================================= */

.frame-shell{
  position:absolute;
  z-index:8;
  pointer-events:none;
}

/* rama închisă, ca panourile din AI Colors */
.frame-shell .outer{
  position:absolute;
  inset:0;
  border:10px solid rgba(var(--panel),.94);
  border-radius:24px;
  background:transparent;
  box-shadow:
    -10px 0 26px rgba(var(--a),.30),
     10px 0 26px rgba(var(--b),.30),
    inset 0 0 0 1px rgba(var(--line),.9);
  animation:borderPulse 2.8s ease-in-out infinite;
}

/* inelul în degrade portocaliu -> albastru (ca logo-ul AI COLORS) */
.frame-shell .ring{
  position:absolute;
  inset:-2px;
  border-radius:26px;
  padding:2px;
  background:linear-gradient(135deg,rgb(var(--a)) 0%,rgb(var(--a)) 30%,rgb(var(--b)) 70%,rgb(var(--b)) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask-composite:exclude;
  filter:drop-shadow(0 0 6px rgba(var(--a),.55));
}

.frame-shell .inner{
  position:absolute;
  inset:13px;
  border:2px solid rgba(230,232,238,.22);
  border-radius:13px;
  box-shadow:inset 0 0 8px rgba(var(--b),.22);
  animation:innerPulse 2.1s ease-in-out infinite;
}

.frame-shell .edge-glow{
  position:absolute;
  inset:-12px;
  border-radius:30px;
  box-shadow:
    -18px 0 40px rgba(var(--a),.16),
     18px 0 40px rgba(var(--b),.16);
  animation:edgeGlow 3.2s ease-in-out infinite;
}

.frame-window{
  position:absolute;
  left:20px;
  top:20px;
  background:transparent !important;
}

/* =========================================================
   CAMERA 4:3  (zona transparentă: 800 x 600)
========================================================= */

.camera-shell{
  left:40px;
  top:40px;
  width:840px;
  height:640px;
}

.camera-shell .frame-window{
  width:800px;
  height:600px;
}

/* bara cu platformele, lipită sub cameră */
.social-rotator{
  position:absolute;z-index:24;left:180px;top:680px;width:560px;height:100px;
  border-radius:0 0 16px 16px;
  background:linear-gradient(120deg,rgba(var(--bg),.86),rgba(var(--panel),.80));
  border:1px solid rgba(var(--line),.95);border-top:0;
  box-shadow:0 6px 22px rgba(0,0,0,.35),inset 0 -1px 0 rgba(230,232,238,.06);
  overflow:hidden;
}
.social-rotator::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,rgb(var(--a)),rgb(var(--b)));opacity:.9;
}
.social-card{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;
  gap:18px;padding:14px 28px 17px;opacity:0;transform:translateY(-4px);
  animation:platformCycle 18s ease-in-out infinite;animation-delay:var(--phase);
  will-change:opacity,transform;
}
.youtube-card{--phase:0s}
.kick-card{--phase:-12s}
.tiktok-card{--phase:-6s}
.social-card::after{
  content:"";position:absolute;left:28px;right:28px;bottom:6px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgb(var(--a)),rgb(var(--b)));
  transform-origin:left;transform:scaleX(0);opacity:.75;
  animation:platformProgress 18s linear infinite;animation-delay:var(--phase);
}
.social-icon{
  width:54px;height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(var(--line),1);border-radius:10px;color:var(--text);
  background:rgba(var(--bg),.85);
}
.social-icon svg{width:36px;height:36px;filter:none}
.youtube-icon svg{width:40px;height:30px}
.youtube-icon .brand-body{fill:var(--yt)}
.youtube-icon .brand-play{fill:#fff}
.kick-icon svg{fill:var(--green)}
.tiktok-icon .brand-cyan{fill:var(--tt1)}
.tiktok-icon .brand-pink{fill:var(--tt2)}
.tiktok-icon .brand-white{fill:#fff}
.platform-copy{min-width:0;display:flex;flex-direction:column;gap:7px}
.platform-name{
  font-size:15px;font-weight:600;letter-spacing:2.6px;line-height:1;color:var(--muted);
}
.platform-handle{
  font-size:32px;font-weight:700;letter-spacing:.3px;line-height:1.1;white-space:nowrap;
  color:var(--text);text-shadow:0 1px 5px rgba(0,0,0,.6);
}
.platform-handle b{color:rgb(var(--a));font-weight:700}
@keyframes platformCycle{
  0%,30.333%{opacity:1;transform:translateY(0)}
  33.333%,97%{opacity:0;transform:translateY(-4px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes platformProgress{
  0%{transform:scaleX(0)}30.333%,33.333%{transform:scaleX(1)}
  33.334%,97%{transform:scaleX(0)}100%{transform:scaleX(0)}
}

/* =========================================================
   SCRATCHES / SLASH / EMBERS
========================================================= */

.scratch-field,.slash-field,.ember-field{position:absolute;inset:0;pointer-events:none}
.scratch-field{z-index:14}
.slash-field{z-index:15}
.ember-field{z-index:16}

.scratch{
  position:absolute;height:6px;opacity:0;
  background:linear-gradient(90deg,transparent,rgb(var(--a)),rgba(255,255,255,.92),rgb(var(--b)),transparent);
  filter:drop-shadow(0 0 7px rgba(var(--a),.9)) drop-shadow(0 0 15px rgba(var(--b),.45));
  clip-path:polygon(0 45%,16% 20%,34% 48%,52% 16%,72% 50%,100% 25%,100% 74%,76% 56%,58% 86%,38% 58%,18% 80%,0 60%);
}
.sc1{width:210px;left:70px;top:48px;transform:rotate(-10deg);animation:scratchOne 2.6s ease-in-out infinite .1s}
.sc2{width:230px;right:60px;top:600px;transform:rotate(-14deg);animation:scratchThree 2.9s ease-in-out infinite 1s}
.sc3{width:240px;left:75px;top:826px;transform:rotate(9deg);animation:scratchTwo 3.1s ease-in-out infinite .3s}
.sc4{width:250px;right:70px;bottom:70px;transform:rotate(-10deg);animation:scratchThree 3s ease-in-out infinite .8s}
.sc5{width:210px;left:420px;top:676px;height:4px;transform:rotate(-3deg);animation:scratchPulse 1.9s ease-in-out infinite}

.slash{
  position:absolute;height:4px;opacity:0;
  background:linear-gradient(90deg,transparent,rgb(var(--a)),rgba(255,255,255,.92),rgb(var(--b)),transparent);
  box-shadow:0 0 10px rgba(var(--a),.9),0 0 22px rgba(var(--b),.45);
}
.sl1{width:260px;left:190px;top:46px;transform:rotate(-10deg);animation:slashCut 3s ease-in-out infinite .4s}
.sl2{width:245px;right:170px;top:830px;transform:rotate(-11deg);animation:slashCutTwo 3.4s ease-in-out infinite 1.15s}
.sl3{width:250px;left:230px;bottom:56px;transform:rotate(8deg);animation:slashCut 3.5s ease-in-out infinite .9s}

.ember{
  position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;
  background:rgb(var(--a));
  box-shadow:0 0 8px rgba(var(--a),1),0 0 18px rgba(var(--a),.6);
}
.ember:nth-child(even){
  background:rgb(var(--b));
  box-shadow:0 0 8px rgba(var(--b),1),0 0 18px rgba(var(--b),.6);
}
.e1{left:80px;bottom:42px;animation:emberRise 2.7s ease-in-out infinite .1s}
.e2{left:210px;bottom:55px;animation:emberRise 3.1s ease-in-out infinite .5s}
.e3{left:390px;bottom:45px;animation:emberRise 2.8s ease-in-out infinite .9s}
.e4{left:550px;bottom:58px;animation:emberRise 3.3s ease-in-out infinite .3s}
.e5{right:380px;bottom:48px;animation:emberRise 2.9s ease-in-out infinite 1.2s}
.e6{right:210px;bottom:52px;animation:emberRise 2.5s ease-in-out infinite .75s}
.e7{right:80px;bottom:43px;animation:emberRise 3.1s ease-in-out infinite .2s}
.e8{left:250px;top:14px;animation:emberDrop 3.2s ease-in-out infinite .4s}
.e9{right:190px;top:560px;animation:emberDrop 2.9s ease-in-out infinite 1.1s}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes borderPulse{0%,100%{filter:brightness(.92)}50%{filter:brightness(1.25)}}
@keyframes innerPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes edgeGlow{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes glowHard{0%,100%{opacity:.38;transform:scale(1)}50%{opacity:.88;transform:scale(1.14)}}
@keyframes glowCenter{0%,100%{opacity:.30;transform:scale(1)}50%{opacity:.72;transform:scale(1.1)}}
@keyframes scratchOne{
  0%,60%,100%{opacity:0;transform:translateX(-28px) rotate(-10deg) scaleX(.65)}
  68%{opacity:1}
  78%{opacity:.78;transform:translateX(0) rotate(-10deg) scaleX(1)}
  88%{opacity:0;transform:translateX(26px) rotate(-10deg) scaleX(.70)}
}
@keyframes scratchTwo{0%,60%,100%{opacity:0}68%{opacity:1}78%{opacity:.78}88%{opacity:0}}
@keyframes scratchThree{0%,60%,100%{opacity:0}68%{opacity:1}78%{opacity:.78}88%{opacity:0}}
@keyframes scratchPulse{0%,100%{opacity:.18}50%{opacity:.82}}
@keyframes slashCut{
  0%,68%,100%{opacity:0;transform:translateX(-30px) rotate(-10deg) scaleX(.65)}
  74%{opacity:1}
  82%{opacity:0;transform:translateX(32px) rotate(-10deg) scaleX(.75)}
}
@keyframes slashCutTwo{0%,68%,100%{opacity:0}74%{opacity:1}82%{opacity:0}}
@keyframes emberRise{
  0%{opacity:0;transform:translateY(12px) translateX(0) scale(.5)}
  18%{opacity:1}
  70%{opacity:.72}
  100%{opacity:0;transform:translateY(-78px) translateX(18px) scale(1.03)}
}
@keyframes emberDrop{
  0%{opacity:0;transform:translateY(-5px) scale(.5)}
  28%{opacity:1}
  100%{opacity:0;transform:translateY(55px) translateX(14px) scale(1)}
}

/* Layout fix 1080 x 1920. Coordonate pentru OBS:
   Camera 4:3: X 60, Y 60, lățime 800, înălțime 600.
   Bara cu platformele: X 180, Y 680, lățime 560, înălțime 100. */
.decorations{position:absolute;inset:0;z-index:2;pointer-events:none;clip-path:url(#safeDecor)}
.foreground-decor{z-index:16}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.social-card{opacity:0}.youtube-card{opacity:1;transform:none}}
</style>
</head>

<body>
<div class="overlay">
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>
<clipPath id="safeDecor" clipPathUnits="userSpaceOnUse">
<path clip-rule="evenodd" fill-rule="evenodd" d="M0 0H1080V1920H0Z M60 60H860V660H60Z"/>
</clipPath></defs></svg>
<!-- OBS: camera la 60,60, 800x600; bara cu platformele lipită sub ramă. -->
<div class="decorations">
  <div class="hot-glow g1"></div>
  <div class="hot-glow g2"></div>
  <div class="hot-glow g3"></div>
</div>

  <!-- CAMERA 4:3 -->
  <div class="frame-shell camera-shell">
    <div class="edge-glow"></div>
    <div class="outer"></div>
    <div class="ring"></div>
    <div class="inner"></div>
    <div class="frame-window"></div>
  </div>

  <!-- PLATFORME (se schimbă pe rând) -->
  <div class="social-rotator">

    <div class="social-card youtube-card">
      <div class="social-icon youtube-icon">
        <svg viewBox="0 3.5 24 17" aria-hidden="true">
          <path class="brand-body"
          d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.070 0 12 0 12s0 3.930.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.930 24 12 24 12s0-3.930-.502-5.814z"/>
          <path class="brand-play" d="M9.545 15.568V8.432L15.818 12Z"/>
        </svg>
      </div>
      <div class="platform-copy">
        <div class="platform-name">YOUTUBE</div>
        <div class="platform-handle">BooHoopeLive</div>
      </div>
    </div>

    <div class="social-card kick-card">
      <div class="social-icon kick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg></div>
      <div class="platform-copy">
        <div class="platform-name">KICK</div>
        <div class="platform-handle">BooHooLive</div>
      </div>
    </div>

    <div class="social-card tiktok-card">
      <div class="social-icon tiktok-icon"><svg viewBox="120 96 360 408" aria-hidden="true">
        <path class="brand-cyan" transform="matrix(1,0,0,-1,260.1782,257.1035)" d="M0 0V16.286C-5.453 17.028-10.993 17.492-16.646 17.492-84.763 17.492-140.178-37.925-140.178-106.041-140.178-147.835-119.297-184.819-87.441-207.185-108.001-185.112-120.204-155.545-120.204-123.071-120.204-55.934-66.77-1.56 0 0"/>
        <path class="brand-cyan" transform="matrix(1,0,0,-1,263.0947,436.9404)" d="M0 0C30.391 0 55.537 24.522 56.665 54.644L56.921 323.231 105.629 323.213 105.554 323.617C104.53 329.143 103.969 334.829 103.969 340.647H36.854L36.746 71.674C35.617 41.554 10.828 17.379-19.563 17.379-29.008 17.379-37.903 19.74-45.733 23.861-35.479 9.65-18.823 0 0 0"/>
        <path class="brand-cyan" transform="matrix(1,0,0,-1,460.4365,205.4219)" d="M0 0V15.757C-18.745 15.757-36.205 21.33-50.848 30.877-37.811 15.903-20.101 4.303 0 0"/>
        <path class="brand-pink" transform="matrix(1,0,0,-1,409.5889,174.54489)" d="M0 0C-14.284 16.405-22.963 37.813-22.963 61.221H-41.248C-36.514 35.649-21.029 13.711 0 0"/>
        <path class="brand-pink" transform="matrix(1,0,0,-1,243.5317,306.2148)" d="M0 0C-31.107 0-56.791-25.82-56.791-56.93-56.791-78.592-44.127-97.414-26.17-106.864-32.862-97.59-36.854-86.245-36.854-73.96-36.854-42.852-11.544-17.542 19.563-17.542 25.37-17.542 30.941-18.5 36.21-20.15V48.367C30.757 49.108 25.217 49.573 19.563 49.573 18.585 49.573 17.619 49.522 16.646 49.499L16.388 49.486 16.206-2.378C10.937-.728 5.807 0 0 0"/>
        <path class="brand-pink" transform="matrix(1,0,0,-1,460.4365,204.61719)" d="M0 0-.312 .061-.328-51.761C-35.128-51.761-67.463-40.307-93.786-21.413L-93.765-158.527C-93.765-226.645-148.789-281.717-216.905-281.717-243.228-281.717-267.635-273.757-287.7-259.671-265.131-283.897-232.985-299.09-197.342-299.09-129.226-299.09-73.811-243.675-73.811-175.558V-39.166C-47.487-58.06-15.237-69.193 19.563-69.193V-2.078C12.854-2.078 6.312-1.352 0 0"/>

      </svg></div>
      <div class="platform-copy">
        <div class="platform-name">TIKTOK</div>
        <div class="platform-handle">BooHooLive</div>
      </div>
    </div>

  </div>

  <div class="decorations foreground-decor">
  <div class="scratch-field">
    <span class="scratch sc1"></span>
    <span class="scratch sc2"></span>
    <span class="scratch sc3"></span>
    <span class="scratch sc4"></span>
    <span class="scratch sc5"></span>
  </div>
  <div class="slash-field">
    <span class="slash sl1"></span>
    <span class="slash sl2"></span>
    <span class="slash sl3"></span>
  </div>
  <div class="ember-field">
    <span class="ember e1"></span>
    <span class="ember e2"></span>
    <span class="ember e3"></span>
    <span class="ember e4"></span>
    <span class="ember e5"></span>

    <span class="ember e7"></span>
    <span class="ember e8"></span>
    <span class="ember e9"></span>
  </div>
  </div>
</div>

<script>
/* Live din AI Colors (opțional): cât timp ești în meci, rama ia culoarea luminilor
   (echipa, damage, kill, bombă, final de rundă). În meniu sau fără AI Colors: portocaliu + albastru.
   În OBS: ...BooHoo-overlay.html?live=0 dezactivează; ?port=3001 dacă ai schimbat portul. */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get("live") === "0") return;
  var base = "http://127.0.0.1:" + (q.get("port") || "3001");
  var BASE_A = [255, 138, 31], BASE_B = [61, 139, 255];
  var curA = BASE_A.slice(), curB = BASE_B.slice(), tA = BASE_A, tB = BASE_B;
  var game = null, live = null, liveAt = 0, root = document.documentElement.style;

  function hex(h) {
    h = String(h || "").replace("#", "");
    return h.length === 6 ? [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }) : null;
  }
  function get(path, cb) {
    fetch(base + path, {cache: "no-store"}).then(function (r) { return r.json(); }).then(cb)
      .catch(function () { if (path === "/api/game") game = null; });
  }
  setInterval(function () { get("/api/game", function (d) { game = d; }); }, 500);
  setInterval(function () {
    get("/api/signalrgb", function (d) {
      var c = d && d.colors && d.colors.length && d.age != null && d.age < 1.5 ? hex(d.colors[0]) : null;
      if (c) { live = c; liveAt = Date.now(); }
    });
  }, 100);

  function targets() {
    if (!game || !game.connected || !game.in_game) return [BASE_A, BASE_B];
    var team = hex(game.palette && game.palette[game.team === "CT" ? "ct" : "t"]) ||
               (game.team === "CT" ? BASE_B : BASE_A);
    var c = live && Date.now() - liveAt < 1500 ? live : team;
    var light = c.map(function (v) { return Math.round(v + (255 - v) * 0.3); });
    return [c, light];
  }
  function step() {
    var t = targets();
    for (var i = 0; i < 3; i++) {
      curA[i] += (t[0][i] - curA[i]) * 0.3;
      curB[i] += (t[1][i] - curB[i]) * 0.3;
    }
    root.setProperty("--a", curA.map(Math.round).join(","));
    root.setProperty("--b", curB.map(Math.round).join(","));
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
